[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-sketch-studio"
version = "0.3.1"
description = "Local and remote photo-to-vector sketch pipeline for robotic pen drawing. Developed by maggogerka."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "maggogerka" }]
keywords = ["robotics", "vectorization", "sketch", "svg", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "Pillow>=10.4,<13",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "scikit-image>=0.24,<1",
  "svgwrite>=1.4,<2",
]

[project.optional-dependencies]
background = ["rembg>=2.0.60,<3", "onnxruntime>=1.19,<2"]
ai = ["torch>=2.3,<3"]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
robot-sketch-studio = "robot_sketch_studio.__main__:main"

[project.urls]
Homepage = "https://github.com/maggogerka/robot-sketch-studio"
Repository = "https://github.com/maggogerka/robot-sketch-studio"
Issues = "https://github.com/maggogerka/robot-sketch-studio/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_sketch_studio = ["static/*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]
