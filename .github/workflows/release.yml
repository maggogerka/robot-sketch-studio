name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[dev,build]"
      - run: ruff check .
      - run: pytest
      - run: python -m PyInstaller --noconfirm --clean robot-sketch-studio.spec
      - shell: pwsh
        run: Compress-Archive -Path dist/RobotSketchStudio/* -DestinationPath dist/RobotSketchStudio-${{ github.ref_name }}-windows-x64.zip
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "dist/RobotSketchStudio-${{ github.ref_name }}-windows-x64.zip" --generate-notes --verify-tag
