name: Windows portable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install ".[build,ai]"
      - run: python -m PyInstaller --noconfirm --clean robot-sketch-studio.spec
      - name: Smoke-test portable server
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/RobotSketchStudio/RobotSketchStudio.exe" -ArgumentList @("--no-browser", "--port", "8123") -WindowStyle Hidden -PassThru
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8123/health" -TimeoutSec 2
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $health -or $health.status -ne "ok" -or $health.version -ne "0.3.0") {
              throw "Portable health check failed"
            }
            $capabilities = Invoke-RestMethod -Uri "http://127.0.0.1:8123/api/v1/capabilities" -TimeoutSec 5
            if (-not $capabilities.engines.clean_ai.dependency_available) {
              throw "Portable Clean AI runtime is missing"
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - shell: pwsh
        run: |
          $zip = "dist/RobotSketchStudio-v0.3.0-windows-x64.zip"
          Compress-Archive -Path dist/RobotSketchStudio/* -DestinationPath $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash *RobotSketchStudio-v0.3.0-windows-x64.zip" | Set-Content -NoNewline "$zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: RobotSketchStudio-v0.3.0-windows-x64
          path: |
            dist/RobotSketchStudio-v0.3.0-windows-x64.zip
            dist/RobotSketchStudio-v0.3.0-windows-x64.zip.sha256
